<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibes</title>

  <!-- Essential third party dependencies required by Vibes -->
  <script src="https://cdn.jsdelivr.net/npm/acorn@8.11.3/dist/acorn.min.js"></script>
  <script src="https://unpkg.com/prettier@2.8.8/standalone.js"></script>
  <script src="https://unpkg.com/prettier@2.8.8/parser-babel.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0c0e12;
      color: #c9d1d9;
      font-family: monospace;
      overflow: hidden;
    }
    #app-container {
      width: 100%;
      height: 100%;
    }
    #startup-overlay {
      position: fixed;
      inset: 0;
      background: #0c0e12;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease-out;
      pointer-events: none;
      opacity: 0;
    }
  </style>

  <!-- Single entry loader: reads dependencies dynamically from luno.json -->
  
  <!-- Canonical LunoParser Engine (Multi-Tier: Localhost -> User Fork -> Karmatics Fallback) -->
  <script src="/LunoParser/LunoPayloadParser.js" onerror="this.onerror=null; (function(el){ var u=(window.location.hostname.endsWith('.github.io')?window.location.hostname.split('.')[0]:'karmatics'); el.src='https://'+u+'.github.io/LunoParser/LunoPayloadParser.js'; el.onerror=function(){ el.onerror=null; el.src='https://karmatics.github.io/LunoParser/LunoPayloadParser.js'; }; })(this);"></script>
  <script src="/LunoParser/LunoClassPatcher.js" onerror="this.onerror=null; (function(el){ var u=(window.location.hostname.endsWith('.github.io')?window.location.hostname.split('.')[0]:'karmatics'); el.src='https://'+u+'.github.io/LunoParser/LunoClassPatcher.js'; el.onerror=function(){ el.onerror=null; el.src='https://karmatics.github.io/LunoParser/LunoClassPatcher.js'; }; })(this);"></script>
  <script src="/Library/LunoLoader.js" onerror="this.onerror=null; (function(el){ var u=(window.location.hostname.endsWith('.github.io')?window.location.hostname.split('.')[0]:'karmatics'); el.src='https://'+u+'.github.io/Library/LunoLoader.js'; el.onerror=function(){ el.onerror=null; el.src='https://karmatics.github.io/Library/LunoLoader.js'; }; })(this);"></script>
</head>
<body>
  <div id="startup-overlay"></div>
  <div id="app-container"></div>

  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      if (typeof LunoLoader !== "undefined") {
        await LunoLoader.loadApp("app-container");
      }
    });
  </script>
</body>
</html>
